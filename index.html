<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial;
        text-align: center;
        background: #eef5ff;
      }

      h1 {
        color: blue;
      }

      .box {
        width: 350px;
        margin: auto;
        margin-top: 20px;
        padding: 20px;
        background: white;
        border-radius: 10px;
        border: 2px solid blue;
      }

      input {
        width: 90%;
        padding: 10px;
        margin: 8px;
      }

      button {
        padding: 10px 20px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
      }

      p {
        color: blue;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h3>1. Prime Number</h3>

      <input type="number" id="prime" />

      <button id="btnPrime">Check</button>

      <p id="primeText"></p>
    </div>

    <div class="box">
      <h3>2. JAMB Score</h3>

      <input type="number" id="jamb" />

      <button id="btnJamb">Check</button>

      <p id="jambText"></p>
    </div>

    <div class="box">
      <h3>3. Retirement Age</h3>

      <input type="number" id="age" />

      <button id="btnAge">Check</button>

      <p id="ageText"></p>
    </div>

    <div class="box">
      <h3>4. Simple Calculator</h3>

      <input type="number" id="num1" />

      <input type="text" id="operator" placeholder="+ - * /" />

      <input type="number" id="num2" />

      <button id="btnCal">Calculate</button>

      <p id="calText"></p>
    </div>
    <div class="box">

<h3>5. Loan Calculator</h3>
<p>Interest Rate- 26% per month</p>

<input type="number" id="loanAmount" placeholder="Enter amount">

<select id="loanMonth">
<option value="1">1 Month</option>
<option value="2">2 Months</option>
<option value="3">3 Months</option>
<option value="4">4 Months</option>
<option value="5">5 Months</option>
<option value="6">6 Months</option>
<option value="7">7 Months</option>
<option value="8">8 Months</option>
<option value="9">9 Months</option>
<option value="10">10 Months</option>
<option value="11">11 Months</option>
<option value="12">12 Months</option>
</select>

<button id="loanBtn">Calculate</button>

<p id="loanText"></p>

</div>
<div class="box">

<h3>6.Investment Calculator</h3>

<input type="number" id="investAmount" placeholder="Enter amount">

<select id="investMonth">
<option value="1">1 Month</option>
<option value="2">2 Months</option>
<option value="3">3 Months</option>
<option value="4">4 Months</option>
<option value="5">5 Months</option>
<option value="6">6 Months</option>
<option value="7">7 Months</option>
<option value="8">8 Months</option>
<option value="9">9 Months</option>
<option value="10">10 Months</option>
<option value="11">11 Months</option>
<option value="12">12 Months</option>
</select>

<button id="investBtn">Calculate</button>

<p id="investText"></p>

</div>
